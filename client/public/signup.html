<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Full-Stack Project</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .signup-container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input { display: block; width: 90%; margin-bottom: 15px; padding: 8px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        #message { margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create an Account</h2>
        <form id="signup-form">
            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" required minlength="6">

            <button type="submit">Sign Up</button>
        </form>
        
        <p id="message"></p>
    </div>

<script type="module" src="../src/signup.ts"></script></body>
</html>
