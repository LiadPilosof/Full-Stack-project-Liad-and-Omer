<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Full-Stack Project</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .signup-container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 340px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.9em; }
        input[type="text"], input[type="email"], input[type="password"] {
            display: block; width: 90%; margin-bottom: 15px; padding: 8px;
        }
        fieldset { border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; padding: 10px; }
        fieldset legend { font-weight: bold; font-size: 0.9em; padding: 0 4px; }
        .radio-option { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .radio-option input { margin: 0; }
        .radio-option label { margin: 0; font-weight: normal; }
        .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 15px; }
        .checkbox-row input { margin-top: 3px; }
        .checkbox-row label { font-weight: normal; font-size: 0.85em; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        #message { margin-top: 15px; font-size: 0.9em; }
        .hint { font-size: 0.75em; color: #666; margin-top: -10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Create an Account</h2>
        <form id="signup-form">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" required minlength="6">
            <div class="hint">At least 6 characters</div>

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" required minlength="6">

            <label for="company">Company:</label>
            <input type="text" id="company" required>


            <fieldset>
                <legend>Role</legend>
                <div class="radio-option">
                    <input type="radio" id="roleWorker" name="role" value="worker" checked>
                    <label for="roleWorker">Worker</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="roleManager" name="role" value="manager">
                    <label for="roleManager">Manager</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="roleAccounting" name="role" value="accounting">
                    <label for="roleAccounting">Accounting</label>
                </div>
            </fieldset>

            <div class="checkbox-row">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
            </div>

            <button type="submit" id="submitBtn">Sign Up</button>
        </form>

        <p id="message"></p>
    </div>
<script type="module" src="../src/signup.ts"></script></body>
</html>
